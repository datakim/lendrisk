name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=lendrisk --cov-report=term-missing
      - run: python examples/cashflow_lending.py
      - run: python examples/credit_diagnostics.py
      - run: python examples/native_scorecard.py
      - run: python examples/quickstart.py
  package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,docs]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_examples.py
      - run: python scripts/check_notebooks.py
      - run: python examples/visual_walkthrough.py --output-dir /tmp/lendrisk-figures
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/lendrisk-wheel-test
      - run: /tmp/lendrisk-wheel-test/bin/python -m pip install dist/*.whl
      - run: /tmp/lendrisk-wheel-test/bin/python examples/cashflow_lending.py
      - run: /tmp/lendrisk-wheel-test/bin/python examples/credit_diagnostics.py
      - run: /tmp/lendrisk-wheel-test/bin/python examples/native_scorecard.py
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "numpy==1.24.4" "pandas==2.0.3" "scikit-learn==1.4.0" "ortools==9.10.4067"
      - run: python -m pytest
      - run: python examples/quickstart.py
      - run: python examples/native_scorecard.py
  upstream-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,reference]"
      - run: python -m pytest tests/test_binning.py tests/test_scorecard.py
      - run: python examples/native_scorecard.py
