[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lendrisk"
version = "0.1.0a2"
description = "Cash-flow features, lending simulations, and credit-risk diagnostics for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "datakim" }]
keywords = ["credit-risk", "cashflow", "underwriting", "merchant-cash-advance", "revenue-based-financing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "ortools>=9.10", "scikit-learn>=1.4"]

[project.optional-dependencies]
reference = ["optbinning>=0.20"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2", "twine>=6", "numpy-financial>=1.0", "scikit-learn>=1.4", "nbclient>=0.10", "ipykernel>=6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "matplotlib>=3.7"]

[project.urls]
Documentation = "https://datakim.github.io/lendrisk/"
Repository = "https://github.com/datakim/lendrisk"
Issues = "https://github.com/datakim/lendrisk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lendrisk"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "notebooks/", "scripts/", ".github/", "README.md", "LICENSE", "NOTICE", "CONTRIBUTING.md", "CHANGELOG.md", "pyproject.toml", "mkdocs.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
